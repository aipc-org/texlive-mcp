[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texlive-mcp"
version = "0.2.0"
description = "Local TeX Live LaTeX MCP server using the official Python SDK"
authors = [ { name = "Yeok", email = "yeoktattcheah@gmail.com" } ]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "typing-extensions>=4.8.0",
  "pypdf>=6,<7",
  "mcp>=1.26,<2"
]

[project.scripts]
texlive-mcp = "latex_mcp_server.local:main"

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.5.0",
  "mypy>=1.8.0",
  "pytest>=8.0.0"
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
strict = false

[tool.setuptools]
# Use automatic package discovery so subpackages (e.g. latex_mcp_server.functions) are included

[tool.setuptools.packages.find]
include = ["latex_mcp_server", "latex_mcp_server.*"]
